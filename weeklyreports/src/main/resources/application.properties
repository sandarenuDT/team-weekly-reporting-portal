# Spring Application Settings
spring.application.name=weekly-reports

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:weekly_report_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:990715Tharu*}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
# Convenient while building; switch to 'validate' once you add Flyway/Liquibase for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8081

# Security / JWT Settings
jwt.secret=${JWT_SECRET:change_this_to_a_long_random_string_at_least_32_bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Application CORS Settings
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}
